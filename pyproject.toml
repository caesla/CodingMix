[project]
name = "codingmix"
version = "0.1.0"
description = "Fresh Spotify music that follows what you are doing in Claude Code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "keyring>=25",
    "platformdirs>=4",
]

[project.scripts]
codingmix = "codingmix.cli:main"
codingmix-hook = "codingmix.hook:main"

[project.gui-scripts]
codingmix-service = "codingmix.service:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codingmix"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
